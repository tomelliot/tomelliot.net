    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: rgb(18, 20, 20);
        --fg: rgb(226, 232, 240);
        --fg-muted: rgba(226, 232, 240, 0.6);
        /* The quietest text still has to clear 4.5:1 against the backdrop. */
        --fg-faint: rgba(226, 232, 240, 0.55);
        --tile-idle: rgba(226, 232, 240, 0.05);
        --page-inline: clamp(1rem, 10vw, 200px);
        --gap: clamp(3px, 0.5vw, 8px);
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
          "Helvetica Neue", sans-serif;
        background-color: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }

      /* The home page puts the inset on main and caps the content inside it;
         doing both on one element would subtract the inset from the cap. */
      main {
        padding: 3rem var(--page-inline) clamp(3rem, 10vw, 7rem);
      }

      .wrap {
        max-width: 1200px;
        margin: 0 auto;
      }

      /* Links inherit the home page's treatment: no underline until hover,
         when a 2px rule slides in under the text. */
      .text-link {
        color: var(--fg);
        text-decoration: none;
        width: fit-content;
        font-size: 16px;
        border-bottom: 2px solid transparent;
        transition: border-bottom 0.4s ease;
      }

      .text-link:hover {
        border-bottom: 2px solid var(--fg);
      }

      .back {
        display: inline-block;
        margin-bottom: clamp(2.5rem, 6vw, 4rem);
      }

      /* The page names itself for assistive tech and search without putting a
         heading between the visitor and the photographs. */
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--gap);
      }

      /* Below the first breakpoint the grid runs to the screen edges, cancelling
         the inset that keeps the heading in the text column. */
      @media (max-width: 699px) {
        .grid {
          margin-inline: calc(-1 * var(--page-inline));
        }
      }

      @media (min-width: 700px) {
        .grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      @media (min-width: 1000px) {
        .grid {
          grid-template-columns: repeat(5, 1fr);
        }
      }

      .tile {
        display: block;
        position: relative;
        aspect-ratio: 1;
        overflow: hidden;
        background-color: var(--tile-idle);
        cursor: zoom-in;
      }

      .tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.6s var(--ease);
      }

      .tile:hover img,
      .tile:focus-visible img {
        transform: scale(1.045);
      }

      .tile:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
      }

      /* Tiles settle in as they scroll into view. JS adds .in; without JS the
         :not(.reveal) default leaves every tile fully visible. */
      .reveal .tile {
        opacity: 0;
        transform: translateY(14px);
      }

      .reveal .tile.in {
        opacity: 1;
        transform: none;
        transition: opacity 0.7s var(--ease) var(--d, 0ms),
          transform 0.7s var(--ease) var(--d, 0ms);
      }

      /* ---- Lightbox ---- */

      .lightbox[hidden] {
        display: none;
      }

      .lightbox:focus {
        outline: none;
      }

      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: clamp(1rem, 4vw, 3rem);
      }

      .lb-backdrop {
        position: absolute;
        inset: 0;
        background-color: rgba(10, 11, 11, 0.985);
        opacity: 0;
        transition: opacity 0.32s var(--ease);
      }

      .lightbox.is-open .lb-backdrop {
        opacity: 1;
      }

      .lb-figure {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.9rem;
        max-width: 100%;
        max-height: 100%;
      }

      .lb-img {
        display: block;
        max-width: min(100%, 1400px);
        /* Leaves room for the caption line and the page padding. */
        max-height: calc(100vh - clamp(6rem, 14vw, 9rem));
        object-fit: contain;
        transform-origin: top left;
      }

      .lb-caption {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1.5rem;
        width: 100%;
        font-size: 14px;
        opacity: 0;
        transition: opacity 0.3s ease 0.15s;
      }

      .lightbox.is-open .lb-caption {
        opacity: 1;
      }

      .lb-place {
        color: var(--fg-muted);
      }

      .lb-index {
        color: var(--fg-faint);
        font-variant-numeric: tabular-nums;
      }

      .lb-btn {
        position: absolute;
        z-index: 2;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 50%;
        background-color: transparent;
        color: var(--fg);
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.3s ease 0.15s, background-color 0.2s ease;
      }

      .lightbox.is-open .lb-btn {
        opacity: 0.55;
      }

      .lightbox.is-open .lb-btn:hover,
      .lightbox.is-open .lb-btn:focus-visible {
        opacity: 1;
        background-color: rgba(226, 232, 240, 0.1);
      }

      .lb-btn:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
      }

      .lb-btn svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .lb-close {
        top: clamp(0.75rem, 2vw, 1.5rem);
        right: clamp(0.75rem, 2vw, 1.5rem);
      }

      .lb-prev,
      .lb-next {
        top: 50%;
        margin-top: -22px;
      }

      .lb-prev {
        left: clamp(0.25rem, 1.5vw, 1.5rem);
      }

      .lb-next {
        right: clamp(0.25rem, 1.5vw, 1.5rem);
      }

      .lb-btn[disabled] {
        opacity: 0.15 !important;
        cursor: default;
        background-color: transparent !important;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }

        .reveal .tile {
          opacity: 1;
          transform: none;
        }
      }

      (function () {
        const grid = document.getElementById("grid");
        const tiles = Array.from(grid.querySelectorAll(".tile"));
        if (!tiles.length) return;

        const reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

        /* ---- Tiles settle in on scroll ---- */

        if ("IntersectionObserver" in window && !reduceMotion) {
          grid.classList.add("reveal");
          const observer = new IntersectionObserver(
            (entries, obs) => {
              let step = 0;
              for (const entry of entries) {
                if (!entry.isIntersecting) continue;
                // Stagger within the batch so a row arrives as a sweep, not a
                // block, but cap it so a fast scroll never queues a long wait.
                entry.target.style.setProperty(
                  "--d",
                  Math.min(step++, 6) * 45 + "ms"
                );
                entry.target.classList.add("in");
                obs.unobserve(entry.target);
              }
            },
            { rootMargin: "0px" }
          );
          tiles.forEach((tile) => observer.observe(tile));
        }

        /* ---- Lightbox ---- */

        const lightbox = document.getElementById("lightbox");
        const lbImg = document.getElementById("lbImg");
        const lbPlace = document.getElementById("lbPlace");
        const lbIndex = document.getElementById("lbIndex");
        const btnClose = lightbox.querySelector(".lb-close");
        const btnPrev = lightbox.querySelector(".lb-prev");
        const btnNext = lightbox.querySelector(".lb-next");
        const focusables = [btnClose, btnPrev, btnNext];

        // A transparent 1x1 keeps the element from ever being a src-less img.
        const BLANK =
          "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";

        let current = -1;
        let lastFocused = null;
        // Opening from a tile adds one history entry, so the browser's back
        // gesture closes the viewer. Stepping between photos only rewrites it.
        let pushedState = false;
        // history.back() reports the hash it restored, and that report must not
        // be mistaken for someone linking to a photo.
        let ignoreNextHashChange = false;

        const full = (i) => PHOTO_BASE + "/" + PHOTOS[i].f + ".avif";
        const thumb = (i) => PHOTO_BASE + "/" + PHOTOS[i].f + "-t.avif";
        const caption = (i) =>
          PHOTOS[i].p ? PHOTOS[i].p + " · " + PHOTOS[i].y : String(PHOTOS[i].y);
        // A caption written in Immich replaces the place line when there is one.
        const label = (i) => PHOTOS[i].c || caption(i);

        function lockScroll(on) {
          const bar = window.innerWidth - document.documentElement.clientWidth;
          document.body.style.overflow = on ? "hidden" : "";
          document.body.style.paddingRight = on && bar > 0 ? bar + "px" : "";
        }

        function render(i) {
          const photo = PHOTOS[i];
          // The ratio is known before the file arrives, so the box never jumps.
          lbImg.style.aspectRatio = photo.w + " / " + photo.h;
          // The thumbnail is already cached from the grid, so it paints at once
          // and the full file replaces it when it lands.
          lbImg.src = thumb(i);
          lbImg.alt = PHOTOS[i].c || "Photograph — " + caption(i);
          const hi = new Image();
          hi.onload = () => {
            if (current === i) lbImg.src = hi.src;
          };
          hi.src = full(i);

          lbPlace.textContent = label(i);
          lbIndex.textContent = i + 1 + " / " + PHOTOS.length;
          btnPrev.disabled = i === 0;
          btnNext.disabled = i === PHOTOS.length - 1;

          // Warm the neighbours so arrowing through feels instant.
          for (const j of [i - 1, i + 1]) {
            if (PHOTOS[j]) new Image().src = full(j);
          }
        }

        /* Grows the image out of the tile it was opened from. Measured after
           layout, so it tracks whatever size the image actually resolved to. */
        function flipFrom(tile) {
          if (reduceMotion || !lbImg.animate) return;
          const from = tile.getBoundingClientRect();
          const to = lbImg.getBoundingClientRect();
          if (!to.width || !to.height) return;
          const scale = from.width / to.width;
          lbImg.animate(
            [
              {
                transform:
                  "translate(" +
                  (from.left - to.left) +
                  "px, " +
                  (from.top - to.top) +
                  "px) scale(" +
                  scale +
                  ")",
                opacity: 0.35,
              },
              { transform: "none", opacity: 1 },
            ],
            { duration: 340, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
          );
        }

        function open(i, tile) {
          if (!PHOTOS[i]) return;
          lastFocused = tile || document.activeElement;
          current = i;
          lightbox.hidden = false;
          render(i);
          lockScroll(true);
          // Two frames: one for the browser to lay the image out, one for the
          // backdrop transition to have a starting value to move from.
          requestAnimationFrame(() => {
            lightbox.classList.add("is-open");
            if (tile) flipFrom(tile);
          });
          lightbox.focus({ preventScroll: true });
        }

        function go(delta) {
          const next = current + delta;
          if (!PHOTOS[next]) return;
          current = next;
          render(next);
          history.replaceState({ lb: next }, "", "#" + PHOTOS[next].id);
        }

        function close() {
          if (current === -1) return;
          const tile = tiles[current];
          current = -1;
          lightbox.classList.remove("is-open");
          lockScroll(false);

          const finish = () => {
            lightbox.hidden = true;
            lbImg.src = BLANK;
            lbImg.style.aspectRatio = "";
          };
          if (reduceMotion || !lbImg.animate) {
            finish();
          } else {
            // Shrink back into the tile, scrolled into view if it drifted.
            tile.scrollIntoView({ block: "nearest", behavior: "instant" });
            const from = lbImg.getBoundingClientRect();
            const to = tile.getBoundingClientRect();
            const anim = lbImg.animate(
              [
                { transform: "none", opacity: 1 },
                {
                  transform:
                    "translate(" +
                    (to.left - from.left) +
                    "px, " +
                    (to.top - from.top) +
                    "px) scale(" +
                    to.width / from.width +
                    ")",
                  opacity: 0.25,
                },
              ],
              { duration: 260, easing: "cubic-bezier(0.4, 0, 1, 1)" }
            );
            anim.onfinish = finish;
            anim.oncancel = finish;
          }

          if (lastFocused) lastFocused.focus({ preventScroll: true });

          if (pushedState) {
            pushedState = false;
            ignoreNextHashChange = true;
            history.back();
          } else if (location.hash) {
            // Arrived on a deep link, so there is no entry to go back to; drop
            // the fragment instead, or a reload would reopen the photo.
            history.replaceState(null, "", location.pathname + location.search);
          }
        }

        tiles.forEach((tile, i) => {
          tile.addEventListener("click", (event) => {
            // Cmd/ctrl-click still opens the full image in a new tab.
            if (event.metaKey || event.ctrlKey || event.shiftKey) return;
            event.preventDefault();
            history.pushState({ lb: i }, "", "#" + PHOTOS[i].id);
            pushedState = true;
            open(i, tile);
          });
        });

        lightbox.addEventListener("click", (event) => {
          if (event.target.dataset.close !== undefined) close();
        });
        btnClose.addEventListener("click", close);
        btnPrev.addEventListener("click", () => go(-1));
        btnNext.addEventListener("click", () => go(1));

        document.addEventListener("keydown", (event) => {
          if (current === -1) return;
          if (event.key === "Escape") close();
          else if (event.key === "ArrowLeft") go(-1);
          else if (event.key === "ArrowRight") go(1);
          else if (event.key === "Tab") {
            // Keep focus inside the dialog while it is open.
            const usable = focusables.filter((el) => !el.disabled);
            const i = usable.indexOf(document.activeElement);
            // From the dialog itself (i === -1), Tab enters at the first control
            // and Shift+Tab at the last.
            const next =
              i === -1
                ? event.shiftKey
                  ? usable.length - 1
                  : 0
                : (i + (event.shiftKey ? -1 : 1) + usable.length) % usable.length;
            event.preventDefault();
            usable[next].focus();
          }
        });

        let touchX = null;
        lightbox.addEventListener(
          "touchstart",
          (event) => {
            touchX = event.changedTouches[0].clientX;
          },
          { passive: true }
        );
        lightbox.addEventListener("touchend", (event) => {
          if (touchX === null) return;
          const dx = event.changedTouches[0].clientX - touchX;
          touchX = null;
          if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
        });

        window.addEventListener("popstate", () => {
          // Clearing this first stops close() from pushing back a second time.
          pushedState = false;
          if (current !== -1) close();
        });

        // A link from anywhere else can name a photo: /gallery/#<id>. Internal
        // navigation uses push/replaceState, which fires no hashchange, so this
        // only ever runs for a hash the page did not set itself.
        function openFromHash() {
          const i = PHOTOS.findIndex((photo) => photo.id === location.hash.slice(1));
          if (i === -1 || i === current) return;
          if (current !== -1) close();
          tiles[i].scrollIntoView({ block: "center", behavior: "instant" });
          open(i, tiles[i]);
        }

        window.addEventListener("hashchange", () => {
          if (ignoreNextHashChange) {
            ignoreNextHashChange = false;
            return;
          }
          openFromHash();
        });
        openFromHash();
      })();
    </script>
  </body>
</html>
