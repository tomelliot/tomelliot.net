<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tom Elliot</title>
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
          "Helvetica Neue", sans-serif;
        background-color: rgb(18, 20, 20);
        color: rgb(226, 232, 240);
        height: 100vh;
        overflow: hidden;
      }

      main {
        display: flex;
        justify-content: center;
        height: 100vh;
        margin: 0 clamp(1rem, 10vw, 200px);
      }

      .container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: clamp(2rem, 5vw, 5rem);
        align-items: center;
        max-width: 1200px;
        width: 100%;
        height: 100vh;
      }

      .headshot-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .content {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        padding-top: calc(50vh - 50px);
        padding-bottom: 2rem;
        height: 100vh;
        overflow-y: auto;
      }

      .content::-webkit-scrollbar {
        width: 0;
      }

      .headshot-container {
        width: 224px;
        height: 224px;
        border-radius: 50%;
        background-color: #82cbec;
        border: 10px solid #82cbec;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 68px;
        overflow: hidden;
      }

      .headshot {
        width: 204px;
        height: 204px;
        border-radius: 0;
        display: block;
        object-fit: cover;
      }

      .section-heading {
        font-size: 24px;
        font-weight: 400;
        margin: 0;
        padding-bottom: 8px;
      }

      .projects {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .project a {
        display: block;
        font-size: 16px;
      }

      .project-description {
        font-size: 14px;
        color: rgba(226, 232, 240, 0.6);
        margin-top: 0.25rem;
      }

      .name {
        font-size: 36px;
        font-weight: 400;
        margin: 0;
        padding-bottom: 32px;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      a {
        color: rgb(226, 232, 240);
        text-decoration: none;
        width: fit-content;

        font-size: 16px;
        border-bottom: 2px solid transparent;
        transition: border-bottom 0.4s ease;
      }

      a:hover {
        border-bottom: 2px solid rgb(226, 232, 240);
      }

      @media (max-width: 768px) {
        body {
          height: auto;
          overflow: auto;
        }

        main {
          height: auto;
          padding: 3rem 0;
        }

        .container {
          grid-template-columns: 1fr;
          gap: 2rem;
          height: auto;
        }

        .headshot-container {
          margin: 0 auto;
        }

        .content {
          padding-top: 0;
          height: auto;
          overflow-y: visible;
        }
      }
    </style>
    <script
      async
      src="https://plausible.io/js/pa-SxoBRI2d9m7vuUghZ1BI2.js"
    ></script>
    <script>
      (window.plausible =
        window.plausible ||
        function () {
          (plausible.q = plausible.q || []).push(arguments);
        }),
        (plausible.init =
          plausible.init ||
          function (i) {
            plausible.o = i || {};
          });
      plausible.init();
    </script>
  </head>
  <body>
    <main>
      <div class="container">
        <div class="headshot-wrapper">
          <div class="headshot-container">
            <img src="headshot.png" alt="Headshot" class="headshot" />
          </div>
        </div>
        <div class="content">
          <h1 class="name">Tom Elliot</h1>
          <div class="links">
            <a
              href="https://www.linkedin.com/in/tom-elliot/"
              target="_blank"
              rel="noopener noreferrer"
              >LinkedIn</a
            >
            <a
              href="https://bsky.app/profile/tomelliot.net"
              target="_blank"
              rel="noopener noreferrer"
              >BlueSky</a
            >
            <a
              href="https://mas.to/@tomelliot"
              target="_blank"
              rel="noopener noreferrer"
              >Mastodon</a
            >
          </div>
          <div class="projects">
            <h2 class="section-heading">Recent Projects</h2>
            <div class="project">
              <a
                href="https://www.fluidseo.app"
                target="_blank"
                rel="noopener noreferrer"
                >FluidSEO</a
              >
              <p class="project-description">Webflow SEO app (SaaS)</p>
            </div>
            <div class="project">
              <a
                href="https://github.com/tomelliot/obsidian-granola-sync/"
                target="_blank"
                rel="noopener noreferrer"
                >Obsidian Granola Sync</a
              >
              <p class="project-description">
                Sync Granola notes to your Obsidian vault (Open Source)
              </p>
            </div>
            <div class="project">
              <a
                href="https://github.com/tomelliot/photo-to-scan"
                target="_blank"
                rel="noopener noreferrer"
                >Photo to Scan</a
              >
              <p class="project-description">
                Process photos of documents and upload them to paperless-ngx
                (Open Source)
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
